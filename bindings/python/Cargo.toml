[package]
name = "typikon-python"
version = "0.3.1"
edition = "2024"
publish = false

[lib]
name = "typikon_python"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
typikon = { path = "../.." }
serde = { version = "1", features = ["derive"] }
pythonize = "0.23"

[build-dependencies]
typikon = { path = "../.." }
