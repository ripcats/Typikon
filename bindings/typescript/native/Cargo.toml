[package]
name = "typikon-typescript-native"
version = "0.2.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi9"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
typikon = { path = "../../.." }

[build-dependencies]
typikon = { path = "../../.." }
